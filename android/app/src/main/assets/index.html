<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Chocolate Rabbit Online Orders</title>
  <style>
    :root{--brown:#2b130b;--brown2:#4a2819;--gold:#e2b83f;--cream:#fff8ec;--paper:#fffdf8;--ink:#27140d;--muted:#765f54;--line:#ead8be;--red:#9f2f29;--green:#316d45}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}
    header{position:sticky;top:0;z-index:5;width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brown);color:white;box-shadow:0 2px 10px #18090055}
    .logo{width:48px;height:48px;flex:0 0 48px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:white}.brand{min-width:0;overflow:hidden;flex:1}.brand strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Georgia,serif;font-size:17px;line-height:1.05}.brand small{color:#efd06f;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .iconbtn{flex:0 0 auto;border:1px solid #8a6434;background:#3b2116;color:white;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:750}.update{background:var(--gold);color:var(--ink);border-color:var(--gold)}
    main{width:100%;max-width:760px;margin:auto;padding:16px 14px 90px}.hidden{display:none!important}.card{max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px #3b1b0c12;padding:16px;margin-bottom:14px}p{overflow-wrap:anywhere}
    h1,h2,h3{font-family:Georgia,serif;margin:0 0 10px}h1{font-size:26px}h2{font-size:22px}.eyebrow{color:#8a6200;font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}
    label{display:block;font-weight:750;font-size:13px;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #cdb89b;background:white;border-radius:10px;padding:12px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 16px;font-weight:800}.primary{background:var(--gold);color:var(--ink)}.secondary{background:#f1e5d2;color:var(--ink)}.danger{background:var(--red);color:white}.wide{width:100%}.buttonrow{display:flex;gap:9px;flex-wrap:wrap}.buttonrow>*{flex:1;min-width:130px}
    .notice{padding:11px 13px;border-radius:10px;margin:10px 0;background:#f7e8ba;color:#5a3f00}.notice.error{background:#f7d9d6;color:#741d18}.notice.ok{background:#dcecdc;color:#225334}
    .filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.filters label{margin:0}.filters button{height:45px}.search{grid-column:1/-1}.summary{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
    .order{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:15px;border-bottom:1px solid var(--line);background:var(--paper)}.order:first-child{border-radius:14px 14px 0 0}.order:last-child{border-bottom:0;border-radius:0 0 14px 14px}.order:only-child{border-radius:14px}.order-title{font-weight:850;font-size:17px}.order-total{font-weight:900;font-size:17px;text-align:right}.order-meta{font-size:13px;color:var(--muted)}
    .badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;background:#eee}.processing{background:#dcebdc;color:#245b35}.pending,.on-hold{background:#f7e8ba;color:#775400}.completed{background:#d9e6f5;color:#234d76}.cancelled,.failed,.refunded{background:#f2dddd;color:#782b2b}
    .empty{text-align:center;padding:34px 12px;color:var(--muted)}.spinner{width:28px;height:28px;border:3px solid #e3d1b7;border-top-color:var(--brown);border-radius:50%;animation:spin .75s linear infinite;margin:34px auto}@keyframes spin{to{transform:rotate(360deg)}}
    .sheet{position:fixed;inset:0;z-index:20;background:#1a0908aa;display:flex;align-items:flex-end}.panel{width:100%;max-height:93vh;overflow:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:18px 14px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0004}.panel-inner{max-width:760px;margin:auto}.close{float:right;border:0;background:#eadbc7;border-radius:50%;width:40px;height:40px;font-size:22px}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid #eee0cc}.line small{color:var(--muted)}.totals{margin-left:auto;max-width:330px}.totalrow{display:flex;justify-content:space-between;padding:4px 0}.grand{font-weight:900;font-size:18px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}.meta-list{margin:5px 0 0;padding-left:18px;color:var(--muted);font-size:13px}.dangerzone{border:1px solid #e4b8b3;background:#fff4f2;border-radius:12px;padding:13px}
    @media(max-width:520px){header{gap:8px}.logo{width:46px;height:46px}.brand strong{font-size:15px}.brand small{font-size:9px}.iconbtn{padding:8px}.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1}.order{padding:13px}.panel{padding-left:12px;padding-right:12px}}
  </style>
</head>
<body>
<header>
  <img class="logo" src="file:///android_res/drawable/chocolate_rabbit_logo.jpg" alt="The Chocolate Rabbit logo">
  <div class="brand"><strong>Chocolate Rabbit</strong><small>Online Orders</small></div>
  <button class="iconbtn update" id="updateButton">Update</button>
</header>
<main>
  <section id="setup" class="hidden">
    <div class="card">
      <div class="eyebrow">Owner setup</div><h1>Pair this phone</h1>
      <p class="muted">In WordPress, open <b>WooCommerce → Orders App</b>, generate a one-time pairing code, then enter it here.</p>
      <div id="setupNotice"></div>
      <label for="storeUrl">Store website</label><input id="storeUrl" inputmode="url" value="https://thechocolaterabbit.net" autocomplete="url">
      <label for="pairCode">Pairing code</label><input id="pairCode" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="12345678">
      <button class="primary wide" id="pairButton" style="margin-top:16px">Pair owner phone</button>
      <p class="muted" style="font-size:12px">The pairing token is encrypted by Android and can be revoked from WordPress at any time.</p>
    </div>
  </section>

  <section id="ordersApp" class="hidden">
    <div class="filters card">
      <label>Status<select id="status"><option value="any">All statuses</option><option value="processing">Processing</option><option value="pending">Pending payment</option><option value="on-hold">On hold</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option><option value="failed">Failed</option></select></label>
      <label>Search<input id="search" class="search" placeholder="Order, customer, email"></label>
      <button class="primary" id="refreshButton">Refresh</button>
    </div>
    <div id="ordersNotice"></div>
    <div class="summary"><h2>Orders</h2><span id="count" class="muted"></span></div>
    <div id="orders"><div class="spinner"></div></div>
    <div class="buttonrow" style="margin-top:14px"><button id="moreButton" class="secondary hidden">Load more</button><button id="unpairButton" class="secondary">Unpair phone</button></div>
  </section>
</main>

<div id="detailSheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="panel"><div class="panel-inner" id="detail"></div></div></div>

<script>
  'use strict';
  const pending = new Map(); let serial = 0, page = 1, loading = false, currentOrder = null;
  const $ = id => document.getElementById(id);
  function call(action,payload={}){return new Promise((resolve,reject)=>{const id='r'+(++serial);pending.set(id,{resolve,reject});OrdersApp.request(id,action,JSON.stringify(payload));});}
  window.onNativeResult=(id,ok,raw)=>{const p=pending.get(id);if(!p)return;pending.delete(id);let data;try{data=JSON.parse(raw)}catch(e){data={message:'The app returned an unreadable response.'}}(ok?p.resolve:p.reject)(data)};
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const money=v=>'$'+Number(v||0).toFixed(2);
  function notice(target,message,type='error'){target.innerHTML=message?`<div class="notice ${type}">${esc(message)}</div>`:''}
  function setBusy(button,busy,label){button.disabled=busy;button.textContent=busy?'Please wait…':label}
  async function boot(){try{const s=await call('state');$('setup').classList.toggle('hidden',s.paired);$('ordersApp').classList.toggle('hidden',!s.paired);if(s.paired)loadOrders(true)}catch(e){$('setup').classList.remove('hidden');notice($('setupNotice'),e.message)}}
  $('updateButton').onclick=()=>call('checkUpdate');
  $('pairButton').onclick=async()=>{const b=$('pairButton');setBusy(b,true,'Pair owner phone');notice($('setupNotice'),'');try{await call('pair',{storeUrl:$('storeUrl').value,code:$('pairCode').value});$('pairCode').value='';$('setup').classList.add('hidden');$('ordersApp').classList.remove('hidden');loadOrders(true)}catch(e){notice($('setupNotice'),e.message)}finally{setBusy(b,false,'Pair owner phone')}};
  $('refreshButton').onclick=()=>loadOrders(true);$('status').onchange=()=>loadOrders(true);$('search').onkeydown=e=>{if(e.key==='Enter')loadOrders(true)};
  $('moreButton').onclick=()=>{page++;loadOrders(false)};
  $('unpairButton').onclick=async()=>{if(!confirm('Unpair this phone? You will need a new code from WordPress to reconnect.'))return;await call('logout');$('ordersApp').classList.add('hidden');$('setup').classList.remove('hidden')};
  async function loadOrders(reset){if(loading)return;loading=true;if(reset){page=1;$('orders').innerHTML='<div class="spinner"></div>'}notice($('ordersNotice'),'');try{const data=await call('orders',{page,status:$('status').value,search:$('search').value});renderOrders(data,reset)}catch(e){if(e.message.includes('not paired')||e.message.includes('pair'))return boot();notice($('ordersNotice'),e.message);if(reset)$('orders').innerHTML='<div class="empty">Orders could not be loaded.</div>'}finally{loading=false}}
  function renderOrders(data,reset){const rows=Array.isArray(data.orders)?data.orders:[];const html=rows.map(o=>`<article class="order" role="button" tabindex="0" data-id="${Number(o.id)}"><div class="order-title">#${Number(o.number||o.id)} · ${esc(o.customer)}</div><div class="order-total">${esc(o.currencySymbol||'$')}${Number(o.total||0).toFixed(2)}</div><div class="order-meta"><span class="badge ${esc(o.status)}">${esc(o.statusLabel||o.status)}</span> · ${esc(o.date)}<br>${esc(o.itemSummary||'')}</div><div class="order-meta" style="text-align:right">${esc(o.paymentMethod||'')}<br>${o.shippingMethod?esc(o.shippingMethod):''}</div></article>`).join('');
    if(reset)$('orders').innerHTML=html||'<div class="empty">No orders match these filters.</div>';else $('orders').insertAdjacentHTML('beforeend',html);$('count').textContent=`${Number(data.total||rows.length)} total`;$('moreButton').classList.toggle('hidden',page>=Number(data.pages||1));document.querySelectorAll('.order').forEach(el=>{el.onclick=()=>openOrder(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')openOrder(el.dataset.id)}})}
  async function openOrder(id){$('detailSheet').classList.remove('hidden');$('detail').innerHTML='<div class="spinner"></div>';try{currentOrder=(await call('order',{id:Number(id)})).order;renderDetail(currentOrder)}catch(e){$('detail').innerHTML=`<button class="close" onclick="closeDetail()">×</button><div class="notice error">${esc(e.message)}</div>`}}
  window.openOrderFromNotification=id=>{if($('ordersApp').classList.contains('hidden'))setTimeout(()=>openOrderFromNotification(id),600);else openOrder(id)};
  window.closeDetail=()=>{$('detailSheet').classList.add('hidden');currentOrder=null};$('detailSheet').onclick=e=>{if(e.target===$('detailSheet'))closeDetail()};
  function renderDetail(o){const items=(o.items||[]).map(i=>`<div class="line"><div><b>${esc(i.name)}</b> × ${Number(i.quantity)}${(i.meta||[]).length?`<ul class="meta-list">${i.meta.map(m=>`<li><b>${esc(m.label)}:</b> ${esc(m.value)}</li>`).join('')}</ul>`:''}</div><b>${money(i.total)}</b></div>`).join('');const totals=(o.totals||[]).map(t=>`<div class="totalrow"><span>${esc(t.label)}</span><b>${money(t.value)}</b></div>`).join('');
    $('detail').innerHTML=`<button class="close" onclick="closeDetail()">×</button><div class="eyebrow">Order ${esc(o.date)}</div><h1>#${Number(o.number||o.id)}</h1><p><span class="badge ${esc(o.status)}">${esc(o.statusLabel)}</span> ${o.paid?'<span class="badge processing">Paid</span>':'<span class="badge pending">Not paid</span>'}</p><div class="card"><h3>${esc(o.customer.name)}</h3><div class="muted">${esc(o.customer.email)}<br>${esc(o.customer.phone)}<br><br>${esc(o.customer.billing).replace(/\n/g,'<br>')}</div></div><div class="section"><h2>Items</h2>${items}<div class="totals">${totals}<div class="totalrow grand"><span>Total</span><span>${money(o.total)}</span></div><div class="totalrow"><span>Refunded</span><span>${money(o.refunded)}</span></div></div></div><div class="section"><h2>Manage order</h2><label>Status<select id="detailStatus">${['pending','processing','on-hold','completed','cancelled','refunded','failed'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${esc((o.statuses||{})[s]||s)}</option>`).join('')}</select></label><button class="primary wide" onclick="saveStatus()">Save status</button><label>Private order note<textarea id="orderNote" placeholder="Add a note for staff"></textarea></label><button class="secondary wide" onclick="addNote()">Add order note</button></div><div class="section dangerzone"><h2>Refund</h2><p class="muted">Refundable now: <b>${money(o.refundable)}</b>. Payment refunds are sent through the original gateway when supported.</p><label>Amount<input id="refundAmount" inputmode="decimal" value="${Number(o.refundable||0).toFixed(2)}"></label><label>Reason<input id="refundReason" placeholder="Reason shown on the order"></label><label style="font-weight:600"><input id="refundPayment" type="checkbox" checked style="width:auto;margin-right:8px">Refund the payment through the gateway</label><button class="danger wide" onclick="refundOrder()" ${Number(o.refundable)<=0?'disabled':''}>Issue refund</button></div>`}
  window.saveStatus=async()=>{try{await call('status',{id:Number(currentOrder.id),status:$('detailStatus').value});notice($('ordersNotice'),'Order status updated.','ok');closeDetail();loadOrders(true)}catch(e){alert(e.message)}};
  window.addNote=async()=>{const note=$('orderNote').value.trim();if(!note)return alert('Enter a note first.');try{await call('note',{id:Number(currentOrder.id),note});alert('Order note added.');$('orderNote').value=''}catch(e){alert(e.message)}};
  window.refundOrder=async()=>{const amount=$('refundAmount').value,reason=$('refundReason').value,refundPayment=$('refundPayment').checked;if(!confirm(`Issue a ${money(amount)} refund${refundPayment?' to the original payment method':''}? This cannot be undone in the app.`))return;try{await call('refund',{id:Number(currentOrder.id),amount,reason,refundPayment});alert('Refund created successfully.');openOrder(currentOrder.id);loadOrders(true)}catch(e){alert(e.message)}};
  boot();
</script>
</body>
</html>
